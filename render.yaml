services:
  - type: web
    name: libretv-mobile-01a13acf
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeployTrigger: off
    envVars:
      - key: PASSWORD
        sync: false
      - key: PROXY_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: COOKIE_SECURE
        value: "true"
      - key: REQUEST_TIMEOUT
        value: "30000"
      - key: DEFAULT_SOURCES
        value: '[{"name":"暴风资源","url":"https://bfzyapi.com/api.php/provide/vod","isAdult":false}]'
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
